name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  memory-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate durable memory
        run: python3 scripts/memory/memory_tool.py validate --strict
