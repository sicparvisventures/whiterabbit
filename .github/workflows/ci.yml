name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Install pinned dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify peer dependency graph
        run: corepack pnpm peers check

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint TypeScript applications
        run: corepack pnpm lint

      - name: Typecheck workspace
        run: corepack pnpm typecheck

      - name: Run TypeScript tests
        run: corepack pnpm test

      - name: Build PWA
        run: corepack pnpm build

      - name: Audit production graph for critical advisories
        run: corepack pnpm audit --prod --audit-level=critical

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate durable memory
        run: python3 scripts/memory/memory_tool.py validate --strict
